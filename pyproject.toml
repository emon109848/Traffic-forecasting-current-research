[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "traffic-attention-benchmark"
version = "0.1.0"
description = "A reproducible comparative study of attention-based traffic forecasting models"
readme = "README.md"
dependencies = ["numpy", "torch"]

# Validated environment versions are recorded in docs/environment_validation.md.
# These declarations are package requirements, not an exact experiment lock.
[tool.setuptools.packages.find]
where = ["src"]
